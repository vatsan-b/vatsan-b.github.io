# Checks the committed site on every push to main and every pull request.
# Quarto is not installed here, so CI never renders: render locally, commit
# docs/ with the sources, then push. GitHub Pages deploys docs/ on its own.
name: checks

on:
  pull_request:
  push:
    branches: [main]

# Read-only: the check only reads files.
permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # Standard library only, nothing to install.
      - run: python3 scripts/check-site.py
